[package]
name = "netguardian-native-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "netguardian_native_host"
path = "src/main.rs"

[dependencies]
netguardian-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[profile.release]
opt-level = "s"
strip = true
