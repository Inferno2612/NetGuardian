<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>NetGuardian — доступ заблокирован</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(1200px 600px at 10% -10%, rgba(110,168,255,0.18), transparent 60%),
                radial-gradient(900px 500px at 110% 10%, rgba(122,240,194,0.12), transparent 55%),
                #0b0d12;
    color: #eef1f6;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    max-width: 440px;
    padding: 36px 32px;
    text-align: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 8px 24px rgba(0,0,0,0.3);
  }
  .icon {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,110,110,0.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; margin: 0 auto 16px;
  }
  h1 { font-size: 17px; margin: 0 0 8px; }
  p { color: #9aa3b2; font-size: 13.5px; line-height: 1.6; margin: 0 0 20px; }
  .site { color: #eef1f6; font-weight: 600; }
  button {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
    color: #eef1f6;
    border-radius: 10px;
    padding: 9px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,0.14); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>Доступ к сайту заблокирован</h1>
    <p>
      Сайт <span class="site" id="siteName">—</span> в списке сайтов,
      требующих включённый VPN. Включите VPN (Hiddify или Amnezia) и
      обновите страницу.
    </p>
    <button id="retryBtn">Я включил VPN — обновить</button>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
