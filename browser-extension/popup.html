<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>NetGuardian</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; width: 260px; padding: 16px;
    background: #14161c; color: #eef1f6;
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px;
  }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa3b2; }
  .dot.on { background: #7af0c2; }
  .dot.off { background: #ff6e6e; }
  h1 { font-size: 13.5px; margin: 0 0 12px; font-weight: 600; }
  .muted { color: #9aa3b2; font-size: 12px; }
</style>
</head>
<body>
  <h1>NetGuardian</h1>
  <div class="row"><span class="dot" id="dot"></span><span id="statusText">Проверка…</span></div>
  <p class="muted" id="domainsText"></p>
  <p class="muted">Список заблокированных сайтов редактируется в приложении NetGuardian.</p>
  <script src="popup.js"></script>
</body>
</html>
